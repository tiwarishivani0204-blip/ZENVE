<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZENVÉ – Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

<div class="background">
    <div class="auth-box">
        <div class="logo">ZENVÉ</div>

        <h2 id="title">Welcome Back</h2>

        <form id="authForm">
            <input 
                type="text" 
                placeholder="Full Name" 
                id="nameField" 
                class="hidden"
            >

            <input 
                type="email" 
                placeholder="Email address" 
                required
            >

            <input 
                type="password" 
                placeholder="Password" 
                required
            >

            <button type="submit">Continue</button>
        </form>

    </div>
</div>
<script src="script.js"></script>

</body>
</html>
